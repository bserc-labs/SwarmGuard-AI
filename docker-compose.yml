# Secrets are read from a local .env file that is never committed.
# Copy .env.example to .env and fill it in before the first `docker compose up`.

# The one peer whose X-Forwarded-For the backend trusts: the nginx container,
# which is given this address statically below. Anchored so the two places that
# must agree cannot drift. Override SWARMGUARD_PROXY_IP only together with
# SWARMGUARD_SUBNET; it must lie inside the subnet and must not be its first
# address, which is the gateway every host-originated connection arrives from.
x-swarmguard:
  proxy_ip: &proxy_ip "${SWARMGUARD_PROXY_IP:-172.28.0.10}"

  # One image, two services: `migrate` runs it once to bring the schema up to
  # date, `backend` runs it to serve. Same build, same tag, so the code that
  # migrated the database is byte-for-byte the code that then reads it.
  backend_image: &backend_image
    build:
      context: ./backend
    image: "swarmguard-backend:${SWARMGUARD_TAG:-local}"

  # What both need. alembic imports the application's settings, so the migrate
  # job validates the same secrets the API does and fails on the same mistakes.
  backend_env: &backend_env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swarmguard}
    REDIS_URL: redis://redis:6379
    # Required. Startup fails on a missing, short, or publicly known value.
    SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required - generate with openssl rand -hex 32}"
    DRONE_API_KEY: "${DRONE_API_KEY:?DRONE_API_KEY is required - generate with openssl rand -hex 32}"
    ALGORITHM: ${ALGORITHM:-HS256}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

services:
  redis:
    image: redis:7-alpine
    container_name: swarmguard-redis
    restart: unless-stopped
    # Not published to the host: the backend reaches it over the compose network.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: swarmguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-swarmguard}
    # Not published to the host. For a shell: docker compose exec postgres psql -U <user>
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # -h 127.0.0.1 probes the TCP listener the backend actually connects to,
    # not the unix socket, which pg_isready reports ready slightly earlier.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      # First boot initialises the cluster before it will answer at all.
      start_period: 30s

  # Runs once per `docker compose up`, then exits. Migrations used to run from
  # the backend's entrypoint on every start, which is safe for exactly one
  # replica: two starting together ran the same DDL concurrently. A one-shot job
  # is the compose spelling of an init container or a Kubernetes Job.
  migrate:
    <<: *backend_image
    container_name: swarmguard-migrate
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
      # Optional: provisions the default organization and its admin. Only the
      # job that does the provisioning is given the admin password; the
      # long-running API never holds it.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}

  backend:
    <<: *backend_image
    container_name: swarmguard-backend
    restart: unless-stopped
    # Loopback only. Published on all interfaces, this was a second ingress
    # that skipped nginx entirely, and uvicorn trusted X-Forwarded-For from
    # whoever reached it -- so a client could pick its own address for the
    # login rate limit and the audit trail. Binding to 127.0.0.1 keeps the
    # documented local demo, /docs, simulate_attack.py and verify_demo.py
    # working unchanged while nothing off-host can bypass the proxy.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      # Not merely started: finished, with exit code 0. If a migration fails the
      # API does not come up at all, and the failure is the migrate container's
      # log rather than a 500 on some later request.
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Every variable in .env reaches the container. Previously only the keys
    # listed under `environment:` did, so GUARD_*, AI_INCIDENTS_ENABLED,
    # MODEL_VERSION, LOGIN_RATE_LIMIT and the rest were silently ignored under
    # Docker: an operator raising the fixed-wing speed limit kept the
    # multirotor default. `environment:` takes precedence over `env_file:`
    # for the same key, so the native-run DATABASE_URL/REDIS_URL in .env
    # cannot clobber the in-network values below.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
      # Blanked, not omitted: .env is passed through whole, and an empty value
      # here is what keeps the admin password out of the API's environment.
      ADMIN_PASSWORD: ""
      # uvicorn honours X-Forwarded-For only from this address -- the nginx
      # container, pinned below. Deliberately under `environment:` rather than
      # .env so it cannot be widened by accident.
      FORWARDED_ALLOW_IPS: *proxy_ip
    # Overrides the image's HEALTHCHECK, so it must not need curl either -- the
    # image no longer installs it. Python is in the image; 127.0.0.1 avoids
    # localhost resolving to [::1] against an IPv4 listener.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      # Migrations no longer run here -- the migrate job has finished before
      # this container starts -- so the grace period covers only the import of
      # the application and its schema check. Failures during it do not count;
      # a success ends it early.
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: swarmguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        # Static, so the backend can name exactly this peer as its trusted
        # proxy. Any other source -- including the gateway, where host and
        # loopback traffic enter -- is untrusted and its X-Forwarded-For is
        # ignored.
        ipv4_address: *proxy_ip
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    # Pinned so the frontend's static address above is stable across hosts.
    # If `docker compose up` reports "Pool overlaps with other one on this
    # address space", set SWARMGUARD_SUBNET and SWARMGUARD_PROXY_IP together in
    # .env, then `docker compose down` once so the network is recreated.
    ipam:
      config:
        - subnet: "${SWARMGUARD_SUBNET:-172.28.0.0/24}"

volumes:
  postgres_data:

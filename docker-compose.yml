version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: swarmguard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swarmguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: swarmguard-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/swarmguard
      - SECRET_KEY=CHANGE_ME
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60

volumes:
  postgres_data:
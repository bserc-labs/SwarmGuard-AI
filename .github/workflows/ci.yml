name: SwarmGuard AI CI

on:
  push:
    branches:
      - main
      # The integration branch is `development`. This said `develop`, which is
      # not a branch in this repository, so every push to the branch the team
      # actually works on ran zero jobs -- no pytest, no Ruff, no Mypy, no
      # frontend build, and no Trivy secret scan, which README.md advertises as
      # the check that blocks merges.
      - development
  # Deliberately unfiltered. A branch filter here means a PR targeting anything
  # unexpected is merged with no checks at all, which is the failure this file
  # just had. Checking a PR that did not need it costs a few runner-minutes;
  # not checking one that did is how the `develop` typo went unnoticed.
  pull_request:

# A pull request cancels its own superseded runs, so a busy PR does not queue
# behind itself. A push to a branch never shares a group with another push:
# every commit on main runs to the end and gets its images published.
#
# The group used to be the ref alone, with cancel-in-progress for everything.
# Merging PR #14 two minutes after PR #13 then killed #13's release job in the
# middle of its image build, so that merge commit was never published and
# scripts/deploy.sh could not deploy it. Turning cancellation off would not be
# enough: GitHub still replaces a *queued* run in the same group, so a third
# quick merge would silently skip the second commit's images. A group per
# commit SHA for pushes rules out both.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      # Matches docker-compose.yml. The plain timescaledb image is what the
      # application actually runs against, and the initial migration issues
      # CREATE EXTENSION timescaledb + create_hypertable, so the test database
      # must be a real TimescaleDB.
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: swarmguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/swarmguard_test
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/swarmguard_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # shap 0.52.0 has no wheels for 3.11. Do not downgrade this without
          # also pinning shap — see commit 2359981.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ephemeral secrets
        # config.py rejects any value in KNOWN_PUBLIC_SECRETS, which is why the
        # old hardcoded `test_ci_secret_key` now fails settings validation at
        # import time. Generating per-run values keeps CI green without putting
        # another well-known string into the repository.
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DRONE_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply database migrations
        working-directory: ./backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: ./backend
        run: pytest -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  integration-security:
    name: Live security suite & restore rehearsal
    runs-on: ubuntu-latest

    # tests/test_sprint7_security.py drives a real server over HTTP. It has
    # existed since sprint 7 and had never once executed in CI: with nothing
    # listening on :8000 every test skipped, and the job stayed green. Auth,
    # RBAC, tenant isolation, audit and the rate limiter were all reported
    # passing while none of them ran. That is what this job is for.
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: swarmguard_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/swarmguard_integration
      REDIS_URL: redis://localhost:6379
      ADMIN_USERNAME: ci_admin
      # Long enough for bootstrap.py's MIN_PASSWORD_LENGTH. Ephemeral: this
      # database and server exist only for the length of this job.
      ADMIN_PASSWORD: ci-integration-password
      SWARMGUARD_API: http://localhost:8000
      # This job is the owner of the live suite: here, and only here, a test
      # that cannot run is a failure rather than a skip. The unit-test job
      # collects the same file without a server and must be free to skip it.
      REQUIRE_LIVE_SECURITY_SUITE: "1"
      # Every test in the suite authenticates, and the production limit of
      # 5/minute meant the third test onwards always took a 429 and skipped.
      # Raised only for this throwaway server; see Settings.LOGIN_RATE_LIMIT.
      LOGIN_RATE_LIMIT: 1000/minute

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ephemeral secrets
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DRONE_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply migrations and provision the admin
        working-directory: ./backend
        run: |
          alembic upgrade head
          python bootstrap.py

      - name: Start the API
        working-directory: ./backend
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 --log-level warning \
            > "${RUNNER_TEMP}/uvicorn.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy:"; cat "${RUNNER_TEMP}/uvicorn.log"; exit 1

      - name: Run the live security suite
        working-directory: ./backend
        # REQUIRE_LIVE_SECURITY_SUITE (job env above) makes this suite fail
        # rather than skip when it cannot run, so "never executed" can no
        # longer read as green.
        run: pytest tests/test_sprint7_security.py -v

      # An untested backup is a hypothesis. The suite has just filled this
      # database with real organizations, users, drones, incidents and audit
      # rows, so it is the right thing to dump, restore into a scratch
      # database, and compare table by table. Run from the same image the
      # compose stack uses for its backup service, against the service
      # container on localhost, with the repository's own scripts mounted --
      # so what passes here is what runs in production, not a look-alike.
      - name: Rehearse a backup and restore
        run: |
          mkdir -p "${RUNNER_TEMP}/backups"
          docker run --rm --network host \
            -v "${PWD}/scripts:/scripts:ro" \
            -v "${RUNNER_TEMP}/backups:/backups" \
            -e PGHOST=localhost -e PGUSER=postgres -e PGPASSWORD=password \
            -e PGDATABASE=swarmguard_integration -e BACKUP_DIR=/backups \
            timescale/timescaledb:latest-pg16 /scripts/rehearse-restore.sh

      - name: Check the backup is recent and complete
        run: |
          docker run --rm \
            -v "${PWD}/scripts:/scripts:ro" \
            -v "${RUNNER_TEMP}/backups:/backups" \
            -e BACKUP_DIR=/backups \
            timescale/timescaledb:latest-pg16 /scripts/check-backups.sh

      - name: API log
        if: always()
        run: cat "${RUNNER_TEMP}/uvicorn.log" || true

  backend-lint:
    name: Backend lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff==0.16.1 mypy==2.3.0

      - name: Run Ruff
        working-directory: ./backend
        run: ruff check --output-format=github .

      # No `ruff format --check` yet: the existing source is unformatted, and a
      # repo-wide reformat would bury the Phase 3 diff. Add it as its own commit.

      - name: Run Mypy
        working-directory: ./backend
        # Scoped in pyproject.toml to the modules that carry the security and
        # tenancy logic. Widen the `files` list as annotations land.
        run: mypy

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  security-scan:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scanner can diff across commits.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The two dependency audits are advisory for now. Neither backlog has been
      # triaged, and a CVE published against a transitive pin would turn every
      # unrelated PR red. Flip both to blocking (drop continue-on-error) once
      # the first triage pass is done — that is a deliberate decision, not a
      # thing to leave until it happens by accident.
      - name: Audit Python dependencies (advisory)
        continue-on-error: true
        working-directory: ./backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit npm dependencies (advisory)
        continue-on-error: true
        working-directory: ./frontend
        run: npm audit --audit-level=high

      # Secret scanning blocks. This is the check that catches a SECRET_KEY or
      # DRONE_API_KEY committed back into docker-compose.yml or config.py, which
      # is exactly the regression Phase 0 just finished removing.
      - name: Scan for committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

      - name: Scan for vulnerabilities and misconfiguration (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # Release: build -> scan -> push, on main only, and only after every other
  # job is green. CI used to test the code and never publish anything, so
  # there was nothing to deploy and nothing to roll back to.
  #
  # Every image is tagged with the full commit SHA. That tag is immutable, so
  # "what is running" always maps to exactly one commit, and a rollback is the
  # previous tag. `main` and `latest` move and are for looking around only.
  #
  # The images are scanned BEFORE they are pushed: a CRITICAL or HIGH finding
  # with a fix available means nothing is published from this commit. The
  # filesystem scan in security-scan is advisory; this one is the gate, and it
  # sees the built image -- base layers, the venv, the nginx binary -- which
  # the filesystem scan cannot.
  # ---------------------------------------------------------------------------
  release:
    name: Build, scan & publish images
    needs: [backend-test, integration-security, backend-lint, frontend, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase path; repository owners need not be.
      - name: Image names
        id: names
        run: |
          prefix="${REGISTRY}/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${prefix}/swarmguard-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}/swarmguard-frontend" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.sha_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ steps.names.outputs.frontend }}:${{ steps.names.outputs.sha_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Scan backend image (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.names.outputs.frontend }}:${{ steps.names.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          for image in "${{ steps.names.outputs.backend }}" "${{ steps.names.outputs.frontend }}"; do
            docker tag "$image:${{ steps.names.outputs.sha_tag }}" "$image:main"
            docker tag "$image:${{ steps.names.outputs.sha_tag }}" "$image:latest"
            docker push "$image:${{ steps.names.outputs.sha_tag }}"
            docker push "$image:main"
            docker push "$image:latest"
          done

      - name: What to deploy
        run: |
          {
            echo "## Images published"
            echo
            echo '```'
            echo "SWARMGUARD_TAG=${{ steps.names.outputs.sha_tag }}"
            echo "scripts/deploy.sh ${{ steps.names.outputs.sha_tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


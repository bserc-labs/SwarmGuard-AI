# Security headers, as one unit. Included by the HTTPS server AND by every
# location inside it that sets a header of its own.
#
# That second part is not tidiness. nginx inherits add_header from the enclosing
# level only if the current level defines none: a single `add_header` in a
# location silently discards every header declared in the server block. The
# static-asset location set Cache-Control, so every .js and .css file was served
# with no CSP, no X-Frame-Options and -- the one that matters for a script -- no
# `X-Content-Type-Options: nosniff`. The page itself looked fine, which is why
# nobody noticed. tests/test_nginx_config.py fails if a location sets a header
# without including this file.

# A browser that has seen this site once over HTTPS refuses plain HTTP for a
# year afterwards, so a network attacker cannot downgrade the first request.
# Browsers ignore this header on a connection with a certificate error, so the
# self-signed development certificate cannot lock anyone out of localhost.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# OWASP Defense-Grade Security Headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# connect-src is 'self' only. It previously ended in `http: https:`, which
# permitted a fetch to any host — exactly the exfiltration channel a CSP is
# meant to close. Same-origin covers both /api and the /ws upgrade, since
# 'self' includes ws:// and wss:// on the page's own origin.
#
# The Google Fonts sources are gone: typography is now system stacks and
# icons are inline SVG, so the app makes no third-party requests at all.
# Map tiles are the sole remaining external origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

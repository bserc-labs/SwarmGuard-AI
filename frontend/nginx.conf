# ---------------------------------------------------------------------------
# Port 80: nothing is served here. A health probe, the ACME challenge, and a
# redirect. Login passwords, JWTs, the device key and every telemetry packet
# used to cross the network on this port in clear text.
# ---------------------------------------------------------------------------
server {
    listen 80;
    # The base image's 10-listen-on-ipv6-by-default.sh skips this file because it
    # differs from the packaged default, so IPv6 is declared explicitly. Without
    # it, anything resolving localhost to [::1] inside the container gets
    # connection refused.
    listen [::]:80;
    server_name _;
    # "nginx/1.31.6" in every Server header told anyone the exact build to
    # look up CVEs for. Just "nginx" now.
    server_tokens off;

    # For the container health check: answered here, in clear, so the probe
    # needs neither a redirect nor trust in a possibly self-signed certificate.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt HTTP-01. The CA fetches this path over plain HTTP, so it is
    # the one thing that must not be redirected. Empty unless certbot (or any
    # ACME client) writes into the mounted directory -- docs/OPERATIONS.md.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the application.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # /etc/nginx/tls is filled at container start by 40-tls.sh: links to the
    # certificate mounted at /etc/nginx/certs, or, if none is mounted, a
    # self-signed one generated on the spot so a laptop still gets HTTPS.
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    # TLS 1.2 and 1.3 only: 1.0 and 1.1 are deprecated (RFC 8996). The 1.2
    # suites are Mozilla's "intermediate" set -- forward secrecy and AEAD only.
    # 1.3 suites are not configurable here and are all acceptable.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Session tickets reuse one server-side key for every client; without
    # rotating it they quietly undo forward secrecy.
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The interactive docs and the OpenAPI schema stay on the loopback port for
    # developers (http://localhost:8000/docs). Through the public proxy they do
    # not exist: a full route map with request schemas is reconnaissance handed
    # to anyone who asks, and no client of this deployment needs it.
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }
    # Prometheus scrapes the backend inside the compose network
    # (http://backend:8000/metrics). Through the public front it does not exist.
    location = /api/metrics { return 404; }

    # Reverse proxy API requests to backend service
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend speaks plain HTTP to this proxy; this is how it learns the
        # client did not.
        proxy_set_header X-Forwarded-Proto $scheme;
        # The client-certificate headers are the device port's (8443) word that
        # nginx verified a drone's certificate. On this port nothing was
        # verified, so whatever a caller sent under these names is dropped: an
        # empty value means nginx does not pass the header at all.
        proxy_set_header X-Device-Cert-Verify "";
        proxy_set_header X-Device-Cert-Subject "";
        proxy_set_header X-Device-Cert-Serial "";
    }

    # Reverse proxy WebSocket telemetry streaming
    location /ws/ {
        # The handshake carries a single-use ticket as ?ticket=<id> (frontend/
        # src/services/websocket.ts). It used to carry the session JWT there, and
        # the inherited log format writes "$request" -- the full request line,
        # query string included -- so every connect wrote a bearer token to the
        # access log. A ticket is dead within seconds of use, but a credential
        # in a log is still a credential: this location is not logged; the
        # backend logs each accepted socket.
        access_log off;

        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        access_log off;
        # One Cache-Control, written out. `expires 6M` used to sit beside this
        # and emitted a second, different Cache-Control header on every asset.
        add_header Cache-Control "public, max-age=15552000, immutable";
        # An add_header here discards every inherited one, so they are restated.
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# ---------------------------------------------------------------------------
# Port 8443: telemetry ingest for drones holding a client certificate (mTLS).
#
# A device key is a bearer secret: read off a recovered airframe, it sends
# telemetry as that drone until someone revokes it. Here the TLS handshake
# itself demands a certificate from the device CA (scripts/device-ca.sh), not
# revoked, whose private key the caller proves it holds. A caller without one is
# refused by nginx, and the application never sees the request.
#
# The certificate names its drone (O=org:<id>, CN=<drone id>); nginx passes the
# verified subject on and the API refuses a certificate presented for another
# drone. DEVICE_MTLS_REQUIRED makes the API refuse ingest that did not come
# through here at all.
#
# Only the ingest route exists on this port. Operators and the browser use 443.
# ---------------------------------------------------------------------------
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Filled at container start by 41-device-ca.sh: links to the mounted trust
    # directory, or a CA nobody holds the key to, so that with nothing mounted
    # this port starts and admits no one.
    ssl_client_certificate /etc/nginx/tls/device-ca.crt;
    ssl_crl                /etc/nginx/tls/device-crl.pem;
    # `on`, not `optional`: no certificate, no request. Depth 1 is a device
    # certificate signed directly by the device CA, and nothing else.
    ssl_verify_client on;
    ssl_verify_depth 1;

    include /etc/nginx/snippets/security-headers.conf;

    location = /api/telemetry/ingest {
        proxy_pass http://backend:8000/telemetry/ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Set here, so anything a caller sent under these names is replaced.
        proxy_set_header X-Device-Cert-Verify $ssl_client_verify;
        proxy_set_header X-Device-Cert-Subject $ssl_client_s_dn;
        proxy_set_header X-Device-Cert-Serial $ssl_client_serial;
    }

    location / {
        return 404;
    }
}

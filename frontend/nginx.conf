server {
    listen 80;
    # The base image's 10-listen-on-ipv6-by-default.sh skips this file because it
    # differs from the packaged default, so IPv6 is declared explicitly. Without
    # it, anything resolving localhost to [::1] inside the container — including
    # the container healthcheck — gets connection refused.
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # OWASP Defense-Grade Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # connect-src is 'self' only. It previously ended in `http: https:`, which
    # permitted a fetch to any host — exactly the exfiltration channel a CSP is
    # meant to close. Same-origin covers both /api and the /ws upgrade, since
    # 'self' includes ws:// and wss:// on the page's own origin.
    #
    # The Google Fonts sources are gone: typography is now system stacks and
    # icons are inline SVG, so the app makes no third-party requests at all.
    # Map tiles are the sole remaining external origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend service
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy WebSocket telemetry streaming
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
